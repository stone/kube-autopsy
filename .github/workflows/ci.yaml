name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # The e2e suite needs a kernel and a cluster, so it runs nightly rather than
    # on every change.
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      # The agent embeds an architecture-specific eBPF object, so cross-arch
      # compilation is checked explicitly rather than assumed.
      - name: Build (linux/arm64)
        run: GOOS=linux GOARCH=arm64 go build ./...

      - name: Vet
        run: go vet ./...

      # Without these the CO-RE relocation tests skip, and a regression in the
      # eBPF program's kernel-version handling would go unnoticed.
      - name: Fetch kernel BTF fixtures
        run: make btf-fixtures

      - name: Test
        run: go test ./... -race -count=1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # Pinned: `latest` meant a new golangci-lint release could enable a linter
      # and fail a pull request that changed nothing related to it.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.2

  # The eBPF object is a committed binary embedded into the agent, so a change
  # to it ships kernel-level code with no source-level review signal. This
  # rebuilds it from oom.c and fails if the generated Go bindings differ.
  #
  # Only the bindings are compared, not the .o: LLVM does not produce a
  # byte-identical object across compiler versions, but the struct layout and
  # symbol names that userspace depends on must not drift.
  bpf:
    name: eBPF object is reproducible from source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install eBPF toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm libbpf-dev

      - name: Regenerate eBPF objects
        run: make generate-bpf

      - name: Fail if the generated bindings drifted from oom.c
        run: git diff --exit-code -- 'internal/agent/bpf/*.go'

  # Regenerating the CRD must be a no-op; otherwise deploy/base/crd.yaml has
  # drifted from the Go types and clusters run an out-of-date schema.
  manifests:
    name: Generated manifests are up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install controller-gen
        run: go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.21.0

      - name: Regenerate CRDs
        run: PATH="$PATH:$(go env GOPATH)/bin" make generate

      - name: Fail if the CRD drifted from the Go types
        run: git diff --exit-code -- deploy/base/crd.yaml

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # The unit tests never load the eBPF program into a kernel, never create a
  # report end to end, and never apply the manifests users install. This is the
  # only job that does. It is slow, so it runs on pushes to main and on a
  # schedule rather than on every pull request; add the "e2e" label to a PR to
  # run it there too.
  e2e:
    name: End-to-end (kind)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    strategy:
      fail-fast: false
      matrix:
        # Both published postures. The hardened overlay runs the agent
        # unprivileged, which is the configuration most likely to break without
        # anyone noticing.
        overlay: [quickstart, hardened]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install kind
        uses: helm/kind-action@v1.12.0
        with:
          install_only: true

      - name: Run the e2e suite
        env:
          OVERLAY: ${{ matrix.overlay }}
        run: ./test/e2e/run.sh
