# Hardened: least privilege, suitable for a shared or multi-tenant cluster.
#
# This is the base as-is plus NetworkPolicies. The base already:
#   * runs the agent unprivileged with CAP_BPF, CAP_PERFMON and CAP_SYS_RESOURCE,
#     seccompProfile RuntimeDefault, a read-only root filesystem and no host PID
#     namespace, mounting only /var/log/pods read-only;
#   * gives the agent and controller separate ServiceAccounts, so compromising
#     the node-resident agent does not grant the ability to delete reports;
#   * serves metrics over TLS, requiring each scrape to authenticate and pass a
#     SubjectAccessReview;
#   * leaves container log capture off, so report readers cannot see application
#     log content they could not otherwise read.
#
# CAP_BPF and CAP_PERFMON require Linux 5.8 or newer on every node. That is the
# same floor the agent already has from its BPF ring buffer, so it rules out no
# kernel the quickstart overlay would have supported — on a pre-5.8 node neither
# overlay can load the program.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-autopsy

resources:
  - ../../base
  - networkpolicy.yaml
