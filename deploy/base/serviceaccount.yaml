# The agent and the controller use separate identities. The agent runs on every
# node with elevated kernel privileges, so a compromise of it must not also hand
# over the controller's rights — in particular the ability to delete crash
# reports, which on a forensics tool means destroying evidence.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-autopsy-agent
  namespace: kube-autopsy
  labels:
    app.kubernetes.io/name: kube-autopsy
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: kube-autopsy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-autopsy-controller
  namespace: kube-autopsy
  labels:
    app.kubernetes.io/name: kube-autopsy
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: kube-autopsy
