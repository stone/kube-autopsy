---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: podcrashreports.autopsy.tty.se
spec:
  group: autopsy.tty.se
  names:
    kind: PodCrashReport
    listKind: PodCrashReportList
    plural: podcrashreports
    shortNames:
    - pcr
    singular: podcrashreport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.podName
      name: Pod
      type: string
    - jsonPath: .spec.containerName
      name: Container
      type: string
    - jsonPath: .spec.terminationReason
      name: Reason
      type: string
    - jsonPath: .spec.exitCode
      name: Exit
      type: integer
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PodCrashReport is the Schema for the podcrashreports API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PodCrashReportSpec defines the desired state of PodCrashReport.
            properties:
              containerName:
                description: ContainerName is the specific container that crashed.
                maxLength: 253
                minLength: 1
                type: string
              exitCode:
                description: ExitCode is the container's exit code.
                format: int32
                type: integer
              namespace:
                description: Namespace is the namespace of the crashed pod.
                maxLength: 63
                minLength: 1
                type: string
              nodeName:
                description: NodeName is the node where the pod was running.
                maxLength: 253
                type: string
              podName:
                description: PodName is the name of the crashed pod.
                maxLength: 253
                minLength: 1
                type: string
              podUID:
                description: |-
                  PodUID identifies the specific pod incarnation that crashed. A pod name
                  is reused across restarts and recreations, so without this a report
                  cannot be attributed to the exact pod it came from.
                maxLength: 36
                type: string
              terminationReason:
                description: TerminationReason is the reason for termination.
                enum:
                - OOMKilled
                - Error
                type: string
              timestamp:
                description: Timestamp is the time the crash was detected.
                format: date-time
                type: string
            required:
            - containerName
            - exitCode
            - namespace
            - nodeName
            - podName
            - terminationReason
            - timestamp
            type: object
          status:
            description: PodCrashReportStatus defines the observed state of PodCrashReport.
            properties:
              diagnostics:
                description: Diagnostics contains the captured diagnostic data.
                properties:
                  lastLogLines:
                    description: |-
                      LastLogLines are the final log lines captured before container
                      termination. Only populated when the agent runs with --capture-logs.

                      The bounds are enforced by the API server as well as by the agent: a
                      report that grows past etcd's per-object limit cannot be written at all,
                      which would lose every other diagnostic alongside the logs.
                    items:
                      maxLength: 4096
                      type: string
                    maxItems: 200
                    type: array
                  oomContext:
                    description: OOMContext categorizes if the OOM was ContainerLimit
                      or NodeExhaustion.
                    enum:
                    - ContainerLimit
                    - NodeExhaustion
                    type: string
                  oomScopeLimitBytes:
                    description: |-
                      OOMScopeLimitBytes is the total memory available to the scope the OOM
                      killer was operating in: the container's memory limit for an OOM caused
                      by ContainerLimit, or the node's total RAM for NodeExhaustion. It is a
                      capacity, not a measure of what the victim was using — see
                      VictimRSSBytes for that.
                    format: int64
                    type: integer
                  oomScore:
                    description: |-
                      OOMScore is the kernel's "badness" score for the victim, in pages. This
                      is oom_control's chosen_points, not the 0-1000 value that
                      /proc/<pid>/oom_score reports.
                    format: int64
                    type: integer
                  oomScoreAdj:
                    description: OOMScoreAdj is the adjustment score applied to the
                      victim.
                    format: int32
                    type: integer
                  oomVictimComm:
                    description: OOMVictimComm is the process name of the OOM victim
                      (e.g., "java", "node").
                    type: string
                  oomVictimPid:
                    description: OOMVictimPID is the PID of the process killed by
                      the OOM killer.
                    format: int32
                    type: integer
                  rssDissection:
                    description: |-
                      RSSDissection contains the memory breakdown at the time of OOM. It is
                      omitted when the running kernel's memory layout was not recognised.
                    properties:
                      anonRssBytes:
                        format: int64
                        type: integer
                      fileRssBytes:
                        format: int64
                        type: integer
                      pageTablesBytes:
                        format: int64
                        type: integer
                    type: object
                  triggerComm:
                    description: TriggerComm is the name of the process that triggered
                      the OOM.
                    type: string
                  triggerPid:
                    description: TriggerPID is the PID of the process that triggered
                      the OOM.
                    format: int32
                    type: integer
                  victimRssBytes:
                    description: |-
                      VictimRSSBytes is the victim's resident set size (anonymous plus
                      file-backed) at the moment the OOM killer selected it. It is omitted when
                      the running kernel's memory layout was not recognised.
                    format: int64
                    type: integer
                type: object
              notifiedAt:
                description: |-
                  NotifiedAt records when a webhook notification was delivered, so a
                  delivery is not repeated once it has succeeded.
                format: date-time
                type: string
              phase:
                description: |-
                  Phase indicates the processing state. It is empty until the agent has
                  attached diagnostics, which is how the controller knows not to process a
                  report that is still being written.
                enum:
                - Pending
                - Processed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
