apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-autopsy-agent
  namespace: kube-autopsy
  labels:
    app.kubernetes.io/name: kube-autopsy
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: kube-autopsy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-autopsy
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-autopsy
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: kube-autopsy
    spec:
      serviceAccountName: kube-autopsy-agent
      # An OOM diagnostic tool is useless on the nodes it cannot reach, and
      # control-plane and dedicated nodes are exactly where an unexplained OOM
      # is most costly. Without this the agent silently skips every tainted node.
      tolerations:
        - operator: Exists
      # The agent must outlive the workloads it is diagnosing; without this it
      # is itself an eviction and OOM candidate.
      priorityClassName: system-node-critical
      containers:
        - name: agent
          image: ghcr.io/stone/kube-autopsy:latest
          # Releases pin a version tag; override with a digest for immutability.
          imagePullPolicy: IfNotPresent
          args: ["agent"]
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            # Loading BPF programs and attaching kprobes needs only these
            # capabilities on Linux 5.8 and newer, which is the agent's minimum
            # kernel anyway. Running fully privileged additionally disables
            # seccomp and exposes every host device, which this agent has no use
            # for — the quickstart overlay patches this back to privileged only
            # to get past sandboxed and nested runtimes that deny bpf(2) to a
            # capable-but-unprivileged process.
            capabilities:
              drop:
                - ALL
              add:
                - BPF
                - PERFMON
                # Only needed below 5.11, where BPF maps are charged against
                # RLIMIT_MEMLOCK. Harmless on newer kernels.
                - SYS_RESOURCE
            privileged: false
            # Capabilities granted at start are unaffected by this; it only
            # blocks acquiring further privileges via setuid binaries.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # Container log files, read only when --capture-logs is enabled.
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
      terminationGracePeriodSeconds: 30
