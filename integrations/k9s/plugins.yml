plugins:
  # Plugin 1: Extract and format logs directly from a PodCrashReport
  pcr-logs:
    shortCut: l
    confirm: false
    description: "Autopsy Logs"
    scopes:
      - podcrashreports
    command: bash
    background: false
    args:
      - -c
      - "kubectl get pcr $NAME -n $NAMESPACE -o jsonpath='{range .status.diagnostics.lastLogLines[*]}{@}{\"\\n\"}{end}' | less"

  # Plugin 2: Extract memory context from a PodCrashReport
  pcr-memory:
    shortCut: m
    confirm: false
    description: "Autopsy Memory"
    scopes:
      - podcrashreports
    command: bash
    background: false
    args:
      - -c
      - |
        # jq's "//" binds looser than "/", so `x // 0 / 1024 / 1024` parses as
        # `x // (0/1024/1024)` and the division never happens — which printed raw
        # bytes under an MB label. The parentheses are load-bearing.
        #
        # rssDissection is absent when the kernel's memory layout was not
        # recognised, so every field below has an explicit fallback rather than
        # rendering the string "null".
        kubectl get pcr $NAME -n $NAMESPACE -o json | jq -r '
        def mb: if . == null then "n/a" else (. / 1048576 | floor | tostring) end;
        def bytes: if . == null then "n/a" else tostring end;
        "OOM Context: \(.status.diagnostics.oomContext // "n/a")",
        "Trigger Process: \(.status.diagnostics.triggerComm // "n/a") (PID: \(.status.diagnostics.triggerPid // 0))",
        "Victim Process: \(.status.diagnostics.oomVictimComm // "n/a") (PID: \(.status.diagnostics.oomVictimPid // 0))",
        "Victim RSS (MB): \(.status.diagnostics.victimRssBytes | mb)",
        "OOM Scope Limit (MB): \(.status.diagnostics.oomScopeLimitBytes | mb)",
        "---",
        "Anon RSS (Bytes): \(.status.diagnostics.rssDissection.anonRssBytes | bytes)",
        "File RSS (Bytes): \(.status.diagnostics.rssDissection.fileRssBytes | bytes)",
        "Shmem RSS (Bytes): \(.status.diagnostics.rssDissection.shmemRssBytes | bytes)",
        "Swap (Bytes): \(.status.diagnostics.rssDissection.swapBytes | bytes)",
        "Page Tables (Bytes): \(.status.diagnostics.rssDissection.pageTablesBytes | bytes)"
        ' | less

  # Plugin 3: Jump from a standard Pod to its Crash Report
  pod-autopsy:
    shortCut: Shift-C
    confirm: false
    description: "Find Autopsy Report"
    scopes:
      - pods
    command: bash
    background: false
    args:
      - -c
      - |
        # Selected server-side by label, and sorted so the most recent crash of a
        # repeatedly-killed container is the one shown.
        REPORT=$(kubectl get pcr -n $NAMESPACE -l "autopsy.tty.se/pod=$NAME" \
          --sort-by=.metadata.creationTimestamp -o name | tail -n 1)
        if [ -z "$REPORT" ]; then
          echo "No PodCrashReport found for pod $NAME in namespace $NAMESPACE" | less
        else
          kubectl get $REPORT -n $NAMESPACE -o yaml | less
        fi
